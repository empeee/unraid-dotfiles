set -sg escape-time 0

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Window navigation
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Resize pane shortcuts
bind -r H resize-pane -L 1
bind -r J resize-pane -D 1
bind -r K resize-pane -U 1
bind -r L resize-pane -R 1

# Select layout shortcuts
bind M-1 select-layout even-horizontal
bind M-2 select-layout even-vertical
bind M-3 select-layout main-horizontal
bind M-4 select-layout main-vertical
bind M-5 select-layout tiled

# Easier window split keys
bind | split-window -h
bind - split-window -v

# Easy config reload
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# vi mode for copy mode
setw -g mode-keys vi
unbind [
bind Escape copy-mode
unbind p
bind p paste-buffer

# Terminal. This box's terminfo database is minimal (no ncurses-term package - only
# ansi/dumb/linux/xterm*/xterm-ghostty), so tmux-256color/screen-256color don't exist
# here and break curses apps like mc inside tmux ("Unknown terminal"). xterm-256color
# is present and is what this box already used successfully outside tmux.
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"

set -g mouse on
